name: PHANTOMX P0-A Executor Runtime Identity

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Compile exact configured production artifact
        run: |
          set -euo pipefail
          forge build --force
          ART="out/PhantomX_Production_Executor.sol/PhantomX_Production_Executor.json"
          test -f "$ART"
          jq -e '.deployedBytecode.object | type == "string" and length > 2' "$ART" >/dev/null
          jq -r '.deployedBytecode.object' "$ART" > /tmp/compiled_runtime.hex
          echo "compiled_runtime_bytes=$(( ($(wc -c < /tmp/compiled_runtime.hex) - 1) / 2 ))"

      - name: Run fail-closed on-chain identity probes
        shell: bash
        env:
          EXECUTOR: 0x24056bCA6538693aE94Cc97E82f21Ee4EC7f1286
          DEPLOYER: 0x6c32820FC0fEd00E9CF28b67425ba1Ca753bd69e
          DEPLOY_TX: 0x92bc4dc8b3450332c281445fb4443f8725586b18e880a063e0892af2c28c595a
          RPC_URLS: "https://polygon-bor.publicnode.com https://polygon-rpc.com https://rpc-mainnet.maticvigil.com https://1rpc.io/matic"
        run: |
          set -euo pipefail
          mkdir -p evidence
          selected=""
          for rpc in $RPC_URLS; do
            echo "Probing $rpc"
            if ! chain=$(cast chain-id --rpc-url "$rpc" 2>/tmp/e); then cat /tmp/e; continue; fi
            if [ "$chain" != "137" ]; then echo "wrong chain: $chain"; continue; fi
            if ! code=$(cast code "$EXECUTOR" --rpc-url "$rpc"); then cat /tmp/e; continue; fi
            if [ "$code" = "0x" ]; then echo "no code"; continue; fi
            owner=$(cast call "$EXECUTOR" "owner()(address)" --rpc-url "$rpc")
            domain=$(cast call "$EXECUTOR" "DOMAIN_SEPARATOR()(bytes32)" --rpc-url "$rpc")
            paused=$(cast call "$EXECUTOR" "paused()(bool)" --rpc-url "$rpc")
            block=$(cast block-number --rpc-url "$rpc")
            tx_from=$(cast tx "$DEPLOY_TX" --rpc-url "$rpc" --json | jq -r '.from // empty')
            tx_to=$(cast tx "$DEPLOY_TX" --rpc-url "$rpc" --json | jq -r '.to // null')
            receipt_json=$(cast receipt "$DEPLOY_TX" --rpc-url "$rpc" --json)
            receipt_status=$(echo "$receipt_json" | jq -r '.status')
            receipt_contract=$(echo "$receipt_json" | jq -r '.contractAddress // empty')
            deploy_block=$(echo "$receipt_json" | jq -r '.blockNumber')
            deploy_code=$(cast code "$EXECUTOR" --rpc-url "$rpc" --block "$deploy_block")
            deployed_hash=$(cast keccak "$code")
            deployment_hash=$(cast keccak "$deploy_code")
            compiled_hash=$(cast keccak "0x$(cat /tmp/compiled_runtime.hex)")
            jq -n --arg rpc "$rpc" --arg chain "$chain" --arg block "$block" --arg code "$code" --arg owner "$owner" --arg domain "$domain" --arg paused "$paused" --arg tx_from "$tx_from" --arg tx_to "$tx_to" --arg receipt_status "$receipt_status" --arg receipt_contract "$receipt_contract" --arg deploy_block "$deploy_block" --arg deployed_hash "$deployed_hash" --arg deployment_hash "$deployment_hash" --arg compiled_hash "$compiled_hash" '{status:"PROBED",rpc:$rpc,chain_id:($chain|tonumber),latest_block:($block|tonumber),executor_code:$code,executor_code_hash:$deployed_hash,executor_code_bytes:(($code|length)-2)/2,owner:$owner,domain_separator:$domain,paused:($paused=="true"),deployment:{tx:$ENV.DEPLOY_TX,from:$tx_from,to:$tx_to,status:$receipt_status,contract_address:$receipt_contract,block:$deploy_block,code_hash_at_creation:$deployment_hash},compiled_runtime_hash:$compiled_hash,hash_match:($compiled_hash|ascii_downcase==($deployed_hash|ascii_downcase))}' > evidence/runtime_identity.json
            selected="$rpc"
            break
          done
          test -n "$selected" || { jq -n '{status:"BLOCKED",reason:"NO_VALID_RPC"}' > evidence/runtime_identity.json; exit 2; }
          cat evidence/runtime_identity.json
          jq -e '.chain_id == 137 and .executor_code_bytes > 0 and (.owner|ascii_downcase) == (env.DEPLOYER|ascii_downcase) and .deployment.from != null and (.deployment.contract_address|ascii_downcase) == (env.EXECUTOR|ascii_downcase) and .deployment.status == "1" and .hash_match == true' evidence/runtime_identity.json
          echo "P0-A runtime identity preflight PASS: chain/executor/deployer/interface/runtime hash all matched. No transaction broadcast."

      - name: Upload ground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-p0a-runtime-identity-${{ github.sha }}
          path: evidence/