name: PHANTOMX P0-A.1 Executor Lineage

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  reproduce-historical-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install forensic compiler tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install py-solc-x pycryptodome

      - name: Reproduce historical py-solc-x compile_source call exactly
        run: python scripts/p0a1_reproduce_historical_py_solcx.py

      - name: Record exact runtime lineage result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/phantomx-p0a1-lineage/result.json').read_text())
          print(json.dumps(result, indent=2))
          print(f"runtime_match={result['exact_runtime_match']}")
          PY

      - name: Upload lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-p0a1-executor-lineage
          path: /tmp/phantomx-p0a1-lineage/
          if-no-files-found: error

      - name: Enforce exact deployed runtime match
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/phantomx-p0a1-lineage/result.json').read_text())
          if not result['exact_runtime_match']:
              raise SystemExit(
                  'P0-A.1 BLOCKED: reproduced historical py-solc-x runtime does not exactly match deployed runtime'
              )
          print('P0-A.1 exact runtime lineage match: PASS')
