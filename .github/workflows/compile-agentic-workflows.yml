name: Compile PHANTOMX Agentic Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.md'
      - '.github/workflows/compile-agentic-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phantomx-aw-compile-main
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub Agentic Workflows CLI
        shell: bash
        run: |
          set -euo pipefail
          gh extension install github/gh-aw
          gh aw --version

      - name: Compile agentic workflows in strict mode
        shell: bash
        run: |
          set -euo pipefail
          gh aw compile --strict

      - name: Commit generated lock files when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- '.github/workflows/*.lock.yml'; then
            echo 'No generated lock-file changes.'
            exit 0
          fi
          git add .github/workflows/*.lock.yml
          git commit -m 'chore(automation): compile agentic workflow locks'
          git push origin HEAD:main
