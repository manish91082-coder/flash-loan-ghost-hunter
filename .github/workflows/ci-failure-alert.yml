name: PHANTOMX CI Failure Alert

on:
  workflow_run:
    workflows:
      - PHANTOMX P0-A Economic Truth Tests
      - PHANTOMX P0-A Live Quote Probe
      - PHANTOMX P0-B Executor Compile
      - PHANTOMX P0-B Executor Security
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  alert:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-slim
    steps:
      - name: Create or update a single CI failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name || 'Manual CI health check' }}
          RUN_ID: ${{ github.event.workflow_run.id || 'manual' }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions', github.server_url, github.repository) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          title='[CI AUTO-ALERT] PHANTOMX critical workflow failure'
          body=$(cat <<EOF
          ## PHANTOMX CI failure detected

          **Workflow:** ${RUN_NAME}
          **Conclusion:** ${RUN_CONCLUSION}
          **Run:** ${RUN_URL}
          **Head SHA:** ${HEAD_SHA}
          **Run ID:** ${RUN_ID}

          This alert is generated automatically. Inspect the linked workflow run before promoting or executing code.
          EOF
          )

          existing=$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
