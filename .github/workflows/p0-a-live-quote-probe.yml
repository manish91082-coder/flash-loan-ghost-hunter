name: PHANTOMX P0-A Live Polygon Quote Probe

on:
  push:
    branches:
      - 'mission/p0-a-economic-truth-engine'
      - main
  workflow_dispatch:

jobs:
  live-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run read-only Polygon quote probe
        run: python scripts/live_quote_probe.py

      - name: Install historical py-solc-x compiler
        run: python -m pip install --disable-pip-version-check py-solc-x==2.0.3

      - name: Reproduce historical deploy compiler path
        run: python scripts/p0a_historical_compile_exact.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned runtime-identity dependencies
        run: npm install --no-save solc@0.8.19 solc0820@npm:solc@0.8.20 ethers@6

      - name: Run read-only executor runtime identity probe
        run: node scripts/p0a_executor_identity_probe.mjs

      - name: Upload P0-A ground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-p0a-ground-evidence-${{ github.sha }}
          path: evidence/