name: PhantomX V2 & V3 24/7 Cloud Serverless Runner

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes 24/7 in GitHub cloud
  workflow_dispatch:        # Allows 1-Click manual cloud triggering anytime

jobs:
  phantomx_cloud_execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn web3 requests python-dotenv

      - name: Execute PhantomX V2 & V3 24/7 Continuous Shadow Telemetry
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_RPC_URL: "https://polygon-rpc.com"
          MIN_NET_PROFIT_USD: "0.50"
        run: |
          python run_247_continuous_shadow_engine.py --cycles 10
