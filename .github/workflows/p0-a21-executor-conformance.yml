name: PHANTOMX P0-A.2.1 Executor Conformance

on:
  push:
    branches:
      - main
      - mission/p0-a-economic-truth-engine
  pull_request:
    branches:
      - main
      - mission/p0-a-economic-truth-engine

jobs:
  executor-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned solc
        run: npm install --no-save solc@0.8.19

      - name: Prove frozen executor ABI conformance
        run: python3 scripts/p0a21_executor_conformance.py

      - name: Run canonical Python interface tests
        run: python3 -m pytest -q tests/test_p0a2_executor_interface.py
