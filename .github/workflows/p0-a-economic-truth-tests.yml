name: PHANTOMX P0-A Economic Truth Tests

on:
  push:
    branches:
      - main
      - 'mission/**'
  pull_request:
    paths:
      - 'phantomx_core/**'
      - 'execution/**'
      - 'tests/**'
      - '.github/workflows/p0-a-economic-truth-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install EIP-712 test dependency
        run: python -m pip install --disable-pip-version-check 'eth-account>=0.13,<0.14'

      - name: Run P0-A regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
