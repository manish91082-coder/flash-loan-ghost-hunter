name: PHANTOMX P0-B Executor Compile

on:
  push:
    branches:
      - main
      - mission/p0-a-economic-truth-engine
  pull_request:
    branches:
      - main
      - mission/p0-a-economic-truth-engine

jobs:
  compile-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned solc
        run: npm install --no-save solc@0.8.19

      - name: Compile production executor with optimizer
        run: |
          mkdir -p /tmp/phantomx-solc
          npx solcjs --bin --abi --optimize --optimize-runs 200 contracts/PhantomX_Production_Executor.sol -o /tmp/phantomx-solc

      - name: Enforce EIP-170 runtime bytecode limit
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          source = pathlib.Path("contracts/PhantomX_Production_Executor.sol")
          payload = {
              "language": "Solidity",
              "sources": {str(source): {"content": source.read_text()}},
              "settings": {
                  "optimizer": {"enabled": True, "runs": 200},
                  "outputSelection": {"*": {"*": ["evm.deployedBytecode.object", "evm.bytecode.object"]}},
              },
          }
          result = subprocess.run(
              ["npx", "solcjs", "--standard-json"],
              input=json.dumps(payload),
              text=True,
              capture_output=True,
              check=False,
          )
          if result.returncode != 0:
              raise SystemExit(result.stderr or "solc standard-json failed")

          raw = result.stdout
          start = raw.find("{")
          if start < 0:
              raise SystemExit("No JSON compiler output found")
          report = json.loads(raw[start:])
          errors = [e for e in report.get("errors", []) if e.get("severity") == "error"]
          if errors:
              raise SystemExit("\n".join(e.get("formattedMessage", str(e)) for e in errors))

          contracts = report.get("contracts", {}).get(str(source), {})
          artifact = contracts.get("PhantomX_Production_Executor")
          if not artifact:
              raise SystemExit("Executor artifact missing from compiler output")
          runtime_hex = artifact.get("evm", {}).get("deployedBytecode", {}).get("object", "")
          if not runtime_hex:
              raise SystemExit("Optimized runtime bytecode missing")
          runtime_bytes = len(runtime_hex) // 2
          limit = 24_576
          print(f"Executor runtime bytecode: {runtime_bytes} bytes")
          print(f"EIP-170 limit: {limit} bytes")
          if runtime_bytes > limit:
              raise SystemExit(f"EIP-170 violation: runtime bytecode {runtime_bytes} > {limit}")
          print("EIP-170 runtime bytecode gate: PASS")
          PY
