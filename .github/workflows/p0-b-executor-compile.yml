name: PHANTOMX P0-B Executor Compile

on:
  push:
    branches:
      - main
      - mission/p0-a-economic-truth-engine
  pull_request:
    branches:
      - main
      - mission/p0-a-economic-truth-engine

jobs:
  compile-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned solc
        run: npm install --no-save solc@0.8.19

      - name: Compile production executor with optimizer
        run: |
          mkdir -p /tmp/phantomx-solc
          npx solcjs --bin --bin-runtime --abi --optimize --optimize-runs 200 contracts/PhantomX_Production_Executor.sol -o /tmp/phantomx-solc

      - name: Enforce EIP-170 runtime bytecode limit
        run: |
          runtime_file="/tmp/phantomx-solc/contracts_PhantomX_Production_Executor_sol_PhantomX_Production_Executor.bin-runtime"
          test -f "$runtime_file"
          runtime_hex="$(tr -d '\n\r[:space:]' < "$runtime_file")"
          test -n "$runtime_hex"
          test $(( ${#runtime_hex} % 2 )) -eq 0
          runtime_bytes=$(( ${#runtime_hex} / 2 ))
          limit=24576
          echo "Executor runtime bytecode: ${runtime_bytes} bytes"
          echo "EIP-170 limit: ${limit} bytes"
          if [ "$runtime_bytes" -gt "$limit" ]; then
            echo "EIP-170 violation: runtime bytecode ${runtime_bytes} > ${limit}"
            exit 1
          fi
          echo "EIP-170 runtime bytecode gate: PASS"
