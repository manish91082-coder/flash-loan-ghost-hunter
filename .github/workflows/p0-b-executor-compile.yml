name: PHANTOMX P0-B Executor Compile

on:
  push:
    branches:
      - main
      - mission/p0-a-economic-truth-engine
  pull_request:
    branches:
      - main
      - mission/p0-a-economic-truth-engine

jobs:
  compile-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned solc
        run: npm install --no-save solc@0.8.19

      - name: Compile production executor with optimizer
        run: |
          mkdir -p /tmp/phantomx-solc
          npx solcjs --bin --abi --optimize --optimize-runs 200 contracts/PhantomX_Production_Executor.sol -o /tmp/phantomx-solc

      - name: Enforce EIP-170 runtime bytecode limit
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/phantomx-solc')
          bins = list(root.glob('*.bin'))
          if not bins:
              raise SystemExit('No solc runtime bytecode artifact produced')
          for path in bins:
              size = len(path.read_text().strip()) // 2
              print(f'{path.name}: {size} bytes')
              if size > 24576:
                  raise SystemExit(f'EIP-170 violation: {path.name} is {size} bytes')
          PY
