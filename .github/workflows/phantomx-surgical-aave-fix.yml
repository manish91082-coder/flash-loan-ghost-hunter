name: PHANTOMX Surgical Aave Invariant Fix
on:
  push:
    branches: [phantomx/p0-a-2-2-3-a-short-pull-rejection]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proven invariant correction
        run: |
          set -euo pipefail
          f=contracts/PhantomX_Production_Executor.sol
          old='activeExpectedPostProviderBalance=activeInitialBalance+(finalAmount-totalRepayment);require(postRouteBalance==activeExpectedPostProviderBalance,"Route balance mismatch");'
          new='activeExpectedPostProviderBalance=activeInitialBalance+(finalAmount-totalRepayment);require(postRouteBalance==activeInitialBalance+finalAmount,"Route balance mismatch");'
          grep -F "$old" "$f"
          python - <<'PY'
          from pathlib import Path
          p=Path('contracts/PhantomX_Production_Executor.sol')
          s=p.read_text()
          old='activeExpectedPostProviderBalance=activeInitialBalance+(finalAmount-totalRepayment);require(postRouteBalance==activeExpectedPostProviderBalance,"Route balance mismatch");'
          new='activeExpectedPostProviderBalance=activeInitialBalance+(finalAmount-totalRepayment);require(postRouteBalance==activeInitialBalance+finalAmount,"Route balance mismatch");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git rm .github/workflows/phantomx-surgical-aave-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/PhantomX_Production_Executor.sol
          git commit -m '[PHANTOMX] Correct Aave pre-repayment balance invariant'
          git push origin HEAD:phantomx/p0-a-2-2-3-a-short-pull-rejection
